<!DOCTYPE html>
<html>
<head>
    <title>Voice Test</title>
</head>
<body>
    <h1>Voice Recognition Test</h1>
    <button id="startBtn">Start Listening</button>
    <div id="result"></div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const result = document.getElementById('result');

        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            result.innerHTML = '<p style="color: red;">Speech recognition not supported in this browser. Please use Chrome or Edge.</p>';
        } else {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            startBtn.onclick = () => {
                result.innerHTML = '<p>Listening... Speak now!</p>';
                recognition.start();
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                result.innerHTML = `<p><strong>You said:</strong> ${transcript}</p>`;
            };

            recognition.onerror = (event) => {
                result.innerHTML = `<p style="color: red;">Error: ${event.error}</p>`;
            };
        }
    </script>
</body>
</html>
